name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: "3.12"
      - name: Install backend dev dependencies
        run: pip install "backend/[dev]"
      - name: Lint with ruff
        run: ruff check backend/
      - name: Check formatting with ruff
        run: ruff format --check backend/
      - name: Type check with mypy
        run: mypy backend/app/

  typecheck-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy
      - name: Type check with mypy
        run: mypy backend/app/

  test-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: "3.12"
      - name: Install backend dev dependencies
        run: pip install "backend/[dev]"
      - name: Run pytest (backend)
        run: pytest backend/tests/ -v
      - name: Run unittest (legacy)
        run: python3 -m unittest discover tests/ -v

  test-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.4.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: TypeScript type-check
        run: npx tsc -b
        working-directory: frontend
      - name: Run Vitest
        run: npm run test -- --run
        working-directory: frontend
      - name: Run Node.js test runner (legacy)
        run: node --test static/evidence_quality.test.mjs

  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.4.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
