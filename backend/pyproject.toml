[project]
name = "verity-trust-copilot"
version = "0.2.0"
description = "Self-hosted SaaS security questionnaire copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "pydantic",
    "redis",
    "httpx",
    "structlog",
    "sentry-sdk",
    "slowapi",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "pynacl",
    "passlib[bcrypt]",
    "pyjwt[crypto]",
    "bcrypt",
    "python-multipart",
    "openpyxl",
    "python-docx",
    "numpy",
    "pypdf>=6.15.0",
    "sentence-transformers",
    "torch>=2.12.1",
    "boto3",
    "apscheduler",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",
]

[tool.ruff]
line-length = 120
exclude = ["build", "dist", ".venv", "__pycache__", "*.egg-info"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
disable_error_code = ["var-annotated", "assignment", "union-attr", "arg-type", "return-value", "import-untyped"]
warn_unused_ignores = false

[tool.setuptools.packages.find]
include = ["app*", "emails*"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]
