name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install backend dev dependencies from lock file
        run: pip install -r backend/requirements.txt
      - name: Lint with ruff
        run: ruff check backend/
      - name: Check formatting with ruff
        run: ruff format --check backend/
      - name: Type check with mypy
        run: mypy backend/app/ --config-file backend/pyproject.toml

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies from lock file
        run: pip install -r backend/requirements.txt bandit pip-audit
      - name: Python SAST (Bandit)
        run: bandit -r backend/app/ -c backend/bandit.yaml --severity-level medium
      - name: Python dependency audit
        run: pip-audit
        continue-on-error: true
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  test-python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies from lock file
        run: pip install -r backend/requirements.txt
      - name: Run pytest (backend)
        run: pytest backend/tests/ -v
      - name: Run unittest (legacy)
        run: python3 -m unittest discover tests/ -v

  test-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: npm audit (security)
        run: npm audit --production --audit-level=high
        working-directory: frontend
      - name: TypeScript type-check
        run: npx tsc -b
        working-directory: frontend
      - name: Run Vitest
        run: npm run test -- --run
        working-directory: frontend
      - name: Run Node.js test runner (legacy)
        run: node --test static/evidence_quality.test.mjs

  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
