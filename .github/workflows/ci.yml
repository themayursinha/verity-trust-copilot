name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dev dependencies
        run: pip install "backend/[dev]"

      - name: Lint with ruff
        run: ruff check backend/

      - name: Check formatting with ruff
        run: ruff format --check backend/

      - name: Type check with mypy
        run: mypy backend/app/

  typecheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: pip install mypy

      - name: Type check with mypy
        run: mypy backend/app/

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dev dependencies
        run: pip install "backend/[dev]"

      - name: Run pytest (backend)
        run: pytest backend/tests/ -v

      - name: Run unittest (legacy)
        run: python3 -m unittest discover tests/ -v

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npx tsc -b
        working-directory: frontend

      - name: Run Vitest
        run: npm run test -- --run
        working-directory: frontend

      - name: Run Node.js test runner (legacy)
        run: node --test static/evidence_quality.test.mjs

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
